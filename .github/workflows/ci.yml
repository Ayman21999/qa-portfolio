name: QA Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Run Tests
      run: |
        cd automation
        mvn clean test -Dwebdriver.chrome.driver=/usr/bin/chromedriver
      env:
        DISPLAY: :99

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: TestReport
        path: automation/reports/TestReport.html